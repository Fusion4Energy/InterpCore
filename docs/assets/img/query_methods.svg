<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <!-- Left panel: K nearest -->
  <rect x="10" y="10" width="390" height="360" rx="12" fill="#f5f7ff" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="205" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#3f51b5">QUERY_TYPE.K (K = 4)</text>

  <circle cx="205" cy="200" r="95" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="205" y="94" text-anchor="middle" fill="#c62828">max_distance</text>

  <line x1="205" y1="200" x2="160" y2="170" stroke="#3f51b5" stroke-width="2"/>
  <line x1="205" y1="200" x2="260" y2="220" stroke="#3f51b5" stroke-width="2"/>
  <line x1="205" y1="200" x2="185" y2="260" stroke="#3f51b5" stroke-width="2"/>
  <line x1="205" y1="200" x2="305" y2="160" stroke="#3f51b5" stroke-width="2" stroke-dasharray="4 4"/>

  <g fill="#bbb">
    <circle cx="75" cy="140" r="7"/>
    <circle cx="345" cy="270" r="7"/>
    <circle cx="95" cy="290" r="7"/>
    <circle cx="235" cy="75" r="7"/>
    <circle cx="55" cy="210" r="7"/>
  </g>
  <g fill="#3f51b5">
    <circle cx="160" cy="170" r="7"/>
    <circle cx="260" cy="220" r="7"/>
    <circle cx="185" cy="260" r="7"/>
  </g>
  <circle cx="305" cy="160" r="7" fill="#3f51b5" opacity="0.45"/>
  <path d="M296,151 L314,169 M314,151 L296,169" stroke="#c62828" stroke-width="2.5"/>

  <circle cx="205" cy="200" r="8" fill="#ff7043" stroke="#bf360c" stroke-width="1.5"/>
  <circle cx="205" cy="200" r="16" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="2 3"/>

  <text x="205" y="340" text-anchor="middle" fill="#333">4 nearest found; the 4th is discarded</text>
  <text x="205" y="358" text-anchor="middle" fill="#333">because it is beyond max_distance</text>

  <!-- Right panel: radius -->
  <rect x="420" y="10" width="390" height="360" rx="12" fill="#fff7f3" stroke="#e64a19" stroke-width="1.5"/>
  <text x="615" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#e64a19">QUERY_TYPE.RADIUS</text>

  <circle cx="615" cy="200" r="85" fill="#e64a19" fill-opacity="0.07" stroke="#e64a19" stroke-width="1.8"/>
  <line x1="615" y1="200" x2="700" y2="200" stroke="#e64a19" stroke-width="1.2"/>
  <text x="660" y="194" text-anchor="middle" fill="#e64a19">r = param</text>

  <g fill="#bbb">
    <circle cx="495" cy="150" r="7"/>
    <circle cx="735" cy="280" r="7"/>
    <circle cx="515" cy="290" r="7"/>
    <circle cx="635" cy="80" r="7"/>
    <circle cx="745" cy="180" r="7"/>
  </g>
  <g fill="#3f51b5">
    <circle cx="575" cy="165" r="7"/>
    <circle cx="665" cy="230" r="7"/>
    <circle cx="600" cy="265" r="7"/>
    <circle cx="675" cy="150" r="7"/>
  </g>

  <circle cx="615" cy="200" r="8" fill="#ff7043" stroke="#bf360c" stroke-width="1.5"/>
  <circle cx="615" cy="200" r="16" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="2 3"/>

  <text x="615" y="340" text-anchor="middle" fill="#333">all points inside the sphere are neighbours</text>
  <text x="615" y="358" text-anchor="middle" fill="#333">(their number varies, may be zero)</text>

  <!-- Legend -->
  <g font-size="12">
    <circle cx="30" cy="60" r="6" fill="#ff7043" stroke="#bf360c"/>
    <text x="42" y="64" fill="#333">query point</text>
    <circle cx="30" cy="78" r="6" fill="#3f51b5"/>
    <text x="42" y="82" fill="#333">neighbour</text>
    <circle cx="125" cy="60" r="8" fill="none" stroke="#2e7d32" stroke-dasharray="2 3"/>
    <text x="138" y="64" fill="#333">coincidence_tolerance</text>
  </g>
</svg>
